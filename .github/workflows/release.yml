name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is on main and matches the Cargo.toml version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi

  # The same checks as CI; with main's cache restored they rebuild nothing main already built.
  build:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      upload: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum gcli-* > checksums.txt
          cat checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes gcli-* checksums.txt
