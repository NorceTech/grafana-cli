[package]
name = "grafana-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "gcli_lib"
path = "src/lib.rs"

[[bin]]
name = "gcli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
comfy-table = "8.0.0"
directories = "6.0.0"
humantime = "2.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"

[profile.dev]
incremental = true
opt-level = 0
debug = "line-tables-only"

[profile.release]
incremental = false
opt-level = 3
debug = false

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
